{% extends "base.html" %}

{% block title %}Edit {{ nimi }}{% endblock %}

{% block content %}
<div class="container">
    <h1>Edit Varasto</h1>
    
    <form action="{{ url_for('edit_varasto', varasto_id=varasto_id) }}" 
          method="POST">
        <div class="form-group">
            <label for="nimi">Name:</label>
            <input type="text" id="nimi" name="nimi" 
                   value="{{ nimi }}" required>
        </div>
        
        <p class="stats">
            <strong>Current Balance:</strong> {{ varasto.saldo }} | 
            <strong>Capacity:</strong> {{ varasto.tilavuus }}
        </p>
        
        <button type="submit" class="btn btn-success">Save Changes</button>
        <a href="{{ url_for('view_varasto', varasto_id=varasto_id) }}" 
           class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
