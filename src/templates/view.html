{% extends "base.html" %}

{% block title %}{{ nimi }}{% endblock %}

{% block content %}
<div class="container">
    <h1>{{ nimi }}</h1>
    
    <div class="stats">
        <p><strong>Balance (saldo):</strong> {{ varasto.saldo }}</p>
        <p><strong>Capacity (tilavuus):</strong> {{ varasto.tilavuus }}</p>
        <p><strong>Space left:</strong> {{ varasto.paljonko_mahtuu() }}</p>
    </div>
    
    <hr>
    
    <h2>Add Items</h2>
    <form action="{{ url_for('add_to_varasto', varasto_id=varasto_id) }}" 
          method="POST" class="inline-form">
        <label for="add-amount" class="sr-only">Amount to add</label>
        <input type="number" id="add-amount" name="maara" step="0.1" min="0" 
               placeholder="Amount" aria-label="Amount to add" required>
        <button type="submit" class="btn btn-success">Add to Varasto</button>
    </form>
    
    <h2>Remove Items</h2>
    <form action="{{ url_for('remove_from_varasto', varasto_id=varasto_id) }}" 
          method="POST" class="inline-form">
        <label for="remove-amount" class="sr-only">Amount to remove</label>
        <input type="number" id="remove-amount" name="maara" step="0.1" min="0" 
               placeholder="Amount" aria-label="Amount to remove" required>
        <button type="submit" class="btn btn-danger">
            Remove from Varasto
        </button>
    </form>
    
    <hr>
    
    <a href="{{ url_for('edit_varasto', varasto_id=varasto_id) }}" 
       class="btn btn-secondary">Edit Name</a>
    <form action="{{ url_for('delete_varasto', varasto_id=varasto_id) }}" 
          method="POST" class="inline-form">
        <button type="submit" class="btn btn-danger"
                onclick="return confirm('Delete this varasto?')">
            Delete Varasto
        </button>
    </form>
</div>
{% endblock %}
