{% extends "base.html" %}

{% block title %}Create Varasto{% endblock %}

{% block nav_create %}{% endblock %}

{% block content %}
<div class="container">
    <h1>Create New Varasto</h1>
    
    <form action="{{ url_for('create_varasto') }}" method="POST">
        <div class="form-group">
            <label for="nimi">Name:</label>
            <input type="text" id="nimi" name="nimi" 
                   placeholder="Varasto name" required>
        </div>
        
        <div class="form-group">
            <label for="tilavuus">Capacity (tilavuus):</label>
            <input type="number" id="tilavuus" name="tilavuus" 
                   step="0.1" min="0" value="100" required>
        </div>
        
        <div class="form-group">
            <label for="alku_saldo">Initial Balance (alku_saldo):</label>
            <input type="number" id="alku_saldo" name="alku_saldo" 
                   step="0.1" min="0" value="0">
        </div>
        
        <button type="submit" class="btn btn-success">Create Varasto</button>
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
